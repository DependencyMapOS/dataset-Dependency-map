[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-analysis"
version = "0.1.0"
description = "Backend-only multi-language repository analysis (AST/ASG, datasets, CLI, REST)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "typer>=0.12.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "tree-sitter>=0.21.0",
  "tree-sitter-language-pack>=1.6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "types-setuptools",
]

[project.scripts]
repo-analyze = "repo_analysis.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/repo_analysis/api/**" = ["B008"]
"src/repo_analysis/cli/**" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["repo_analysis"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
